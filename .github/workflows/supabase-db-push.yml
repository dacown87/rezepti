name: Apply Supabase Migrations

# Wendet neue Migrationen aus supabase/migrations/ automatisch auf die
# Produktions-DB an (supabase db push). Schliesst die Luecke, durch die der
# Auth-Slice manuell nachgezogen werden musste: CI fuhr bisher nur
# `db reset --local` (RLS-Gate), nie ein Push gegen Prod.
#
# Benoetigte Secrets:
#   SUPABASE_ACCESS_TOKEN  - Personal Access Token (bereits gesetzt)
#   SUPABASE_DB_PASSWORD   - DB-Passwort, Supabase Dashboard ->
#                            Project Settings -> Database -> Database password
#
# EINMALIG NACH DEM MERGE: Workflow manuell mit Input `baseline = true` starten.
# Das markiert die 7 bereits per SQL-Editor angewendeten Migrationen als
# "applied" (legt die CLI-Historientabelle korrekt an), damit der erste Push
# sie nicht erneut auszufuehren versucht. Danach laeuft der Push automatisch
# bei jeder Migrations-Aenderung auf main.
#
# Hinweis Reihenfolge: Laeuft parallel zum docker-publish-Deploy. Wenn eine
# Migration zwingend VOR dem neuen Servercode live sein muss, den Migrations-PR
# zuerst mergen und den DB-Push abwarten, dann den Code-PR.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-db-push.yml'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Einmalig: bestehende 7 Migrationen als bereits angewendet markieren (repair) statt sie zu pushen'
        type: boolean
        default: false

# Parallele Pushes serialisieren, damit nie zwei db push gleichzeitig laufen.
concurrency:
  group: supabase-db-push
  cancel-in-progress: false

jobs:
  db-push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: zdiqtnljdxuhinqzgcnd
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard required secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."; exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set."; exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      # Einmaliger Baseline-Lauf: markiert die bereits manuell angewendeten
      # Migrationen als "applied", ohne sie auszufuehren. Nur via manuellem
      # Start mit baseline=true.
      - name: Baseline existing migrations (one-time)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline == true }}
        run: |
          supabase migration repair --status applied \
            20260604135550 \
            20260604203218 \
            20260605120000 \
            20260606172525 \
            20260607143000 \
            20260607190000 \
            20260609143000

      - name: Push migrations
        run: supabase db push
