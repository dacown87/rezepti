name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rezepti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rezepti_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rezepti_test
      GROQ_API_KEY: test-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Push schema to test DB
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rezepti_test

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --run --exclude="test/e2e/**"

      - name: Run E2E tests
        run: npm test -- --run test/e2e/
        continue-on-error: true
