name: Keep Supabase Alive

# Supabase Free pausiert Projekte nach laengerer Inaktivitaet (2026-07-07, 2026-08-07).
# /api/v1/health fuehrt eine DB-Abfrage aus und zaehlt damit als Aktivitaet.
# Ist die DB trotzdem schon pausiert, schlaegt der Lauf fehl (GitHub mailt) —
# die Reaktivierung bleibt dann ein manueller Schritt im Supabase-Dashboard.

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          NORTHFLANK_HEALTHCHECK_URL: ${{ secrets.NORTHFLANK_HEALTHCHECK_URL }}
        run: |
          if [ -z "${NORTHFLANK_HEALTHCHECK_URL:-}" ]; then
            echo "NORTHFLANK_HEALTHCHECK_URL secret is missing"
            exit 1
          fi
          for attempt in 1 2 3; do
            if curl -fsS --max-time 20 "$NORTHFLANK_HEALTHCHECK_URL"; then
              echo
              echo "healthy (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 20
          done
          echo "::error::Health check failed 3x — Supabase evtl. pausiert, im Dashboard reaktivieren"
          exit 1
