services:
  rezepti:
    build:
      context: .
      target: dev
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./public:/app/public
    command: npm run dev

  rezepti-prod:
    image: dacown/rezepti:latest
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    profiles:
      - prod

  rezepti-react-prod:
    build:
      context: .
      target: production
    env_file: .env
    environment:
      - NODE_ENV=production
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    profiles:
      - react-prod
